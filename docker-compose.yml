# Brings up a 2-node leader/follower cluster on a shared bridge network.
# Inside the network the nodes address each other as leader/follower on
# port 50051; from the host they map to 50051 (leader) and 50052 (follower).

x-kvstore-base: &kvstore-base
  build: .
  image: kvstore:dev
  networks: [kvnet]

services:
  follower:
    <<: *kvstore-base
    command:
      - "--port"
      - "50051"
      - "--node-id"
      - "follower"
      - "--role"
      - "follower"
      - "--leader-target"
      - "leader:50051"
    ports: ["50052:50051"]

  leader:
    <<: *kvstore-base
    command:
      - "--port"
      - "50051"
      - "--node-id"
      - "leader"
      - "--role"
      - "leader"
      - "--follower-targets"
      - "follower:50051"
    ports: ["50051:50051"]
    depends_on: [follower]

networks:
  kvnet:
    driver: bridge
