// Placeholder service for the kvstore project. Only a Ping RPC exists today;
// the real Get/Put/Delete/replication RPCs will be defined as the design
// evolves.

syntax = "proto3";

package kvstore;

service KvStore {
  rpc Ping(PingRequest) returns (PingResponse);

  rpc Get(GetRequest) returns (GetResponse); 
  rpc Put(PutRequest) returns (PutResponse); 
  rpc Delete(DeleteRequest) returns (DeleteResponse); 
}

message PingRequest {
  string from = 1;
}

message PingResponse {
  string node_id = 1;
  int64 server_time_ms = 2;
}


// Lets say it's a simple string to int key value store 

message GetRequest{
  string key = 1; 
}

message GetResponse{
  int32 value = 1; 
}

message PutRequest{
  string key = 1; 
  int32 value = 2; 
}

message PutResponse{
}

message DeleteRequest{
  string key = 1; 
}

message DeleteResponse{
}
