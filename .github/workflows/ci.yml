# Verifies the scaffold end-to-end on GitHub-hosted Linux runners:
#   1. build_and_test  — vcpkg install, cmake build (Debug), ctest, server/client Ping
#   2. docker_smoke    — docker compose build, bring up the 3-node cluster, Ping each node
# Both jobs run in parallel on separate runners.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build + ctest + Ping (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool python3 zip unzip tar curl

      # Reuses compiled vcpkg packages across runs keyed on vcpkg.json content.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Configure CMake (Debug)
        run: cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Debug)
        run: cmake --build build/debug --parallel

      - name: Run ctest (Debug, ASan + UBSan)
        run: ctest --test-dir build/debug --output-on-failure

      - name: Configure CMake (Release)
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build/release --parallel

      # Smoke test runs against the Release binary on purpose — gRPC's
      # internal use of alloca trips ASan's stack-redzone checks at channel
      # creation, which is a known gRPC/ASan interaction unrelated to our code.
      - name: Smoke test — server + client Ping (Release)
        run: |
          ./build/release/src/kvstore_server --port 50051 --node-id ci-node &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null; then break; fi
            sleep 1
          done
          ./build/release/src/kvstore_client --target localhost:50051 --from ci-client
          kill $SERVER_PID

      - name: Install grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            | sudo tar xz -C /usr/local/bin grpcurl
          grpcurl -version

      - name: Smoke test — Put / Get / Delete via grpcurl (Release)
        run: |
          rm -f /tmp/ci-wal.log
          ./build/release/src/kvstore_server --port 50052 --node-id ci-node-kv \
            --wal-path /tmp/ci-wal.log &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if (echo > /dev/tcp/127.0.0.1/50052) 2>/dev/null; then break; fi
            sleep 1
          done

          set -e
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f /tmp/ci-wal.log' EXIT

          echo "==> Put foo=42"
          grpcurl -plaintext -d '{"key":"foo","value":42}' \
            localhost:50052 kvstore.KvStore/Put

          echo "==> Get foo (expect 42)"
          OUT=$(grpcurl -plaintext -d '{"key":"foo"}' \
            localhost:50052 kvstore.KvStore/Get)
          echo "$OUT"
          echo "$OUT" | grep -q '"value": *42' \
            || { echo "Get returned wrong value: $OUT"; exit 1; }

          echo "==> Delete foo"
          grpcurl -plaintext -d '{"key":"foo"}' \
            localhost:50052 kvstore.KvStore/Delete

          echo "==> Get foo (expect NOT_FOUND)"
          if grpcurl -plaintext -d '{"key":"foo"}' \
              localhost:50052 kvstore.KvStore/Get 2>&1 \
              | grep -q -i 'NotFound\|NOT_FOUND'; then
            echo "Got NOT_FOUND as expected"
          else
            echo "Expected NOT_FOUND after Delete"
            exit 1
          fi

  docker_smoke:
    name: docker compose 3-node Ping
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build docker images
        run: docker compose build

      - name: Bring up 3-node cluster
        run: docker compose up -d

      - name: Wait for nodes to bind
        run: |
          for svc in node1 node2 node3; do
            for i in $(seq 1 30); do
              if docker compose logs $svc 2>&1 | grep -q "listening on"; then
                echo "$svc ready"
                break
              fi
              sleep 1
            done
          done

      - name: Ping each node from inside the compose network
        run: |
          set -e
          for target in node1 node2 node3; do
            echo "==> Pinging $target:50051"
            docker compose exec -T node1 /usr/local/bin/kvstore_client \
              --target $target:50051 --from ci-smoke
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
